<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:450px;
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            margin-bottom:30px;
            color:#333;
        }

        a{
            display:block;
            margin-top:15px;
            text-decoration:none;
            padding:14px;
            border-radius:10px;
            color:white;
            font-weight:bold;
        }

        .view{
            background:#007bff;
        }

        .add{
            background:#28a745;
        }

        .logout{
            background:#dc3545;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <a th:href="@{/students}"
       class="view">

        View Students

    </a>

    <a th:href="@{/addStudent}"
       class="add">

        Add Student

    </a>

    <a th:href="@{/logout}"
       class="logout">

        Logout

    </a>

</div>

</body>

</html>
