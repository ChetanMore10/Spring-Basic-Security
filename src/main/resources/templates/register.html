<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#11998e,#38ef7d);
        }

        .container{
            width:400px;
            background:white;
            padding:35px;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        input,select{
            width:100%;
            padding:13px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:10px;
            outline:none;
        }

        button{
            width:100%;
            padding:13px;
            margin-top:20px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        .error{
            background:#ffe5e5;
            color:red;
            padding:10px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        }

        p{
            margin-top:20px;
            text-align:center;
        }

        a{
            text-decoration:none;
            color:#007bff;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>User Registration</h2>

    <div th:if="${error}"
         class="error">

        <span th:text="${error}"></span>

    </div>

    <form th:action="@{/saveUser}"
          method="post"
          th:object="${user}">

        <input type="text"
               th:field="*{username}"
               placeholder="Enter Username"
               required>

        <input type="password"
               th:field="*{password}"
               placeholder="Enter Password"
               required>

        <select th:field="*{role}"
                required>

            <option value="">
                Select Role
            </option>

            <option value="USER">
                USER
            </option>

            <option value="ADMIN">
                ADMIN
            </option>

        </select>

        <button type="submit">

            Register

        </button>

    </form>

    <p>

        Already have account ?

        <a th:href="@{/login}">
            Login
        </a>

    </p>

</div>

</body>

</html>
