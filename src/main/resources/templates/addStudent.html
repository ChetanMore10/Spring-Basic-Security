<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#eef2f7;
            padding:20px;
        }

        .form-container{

            width:100%;
            max-width:500px;
            background:white;
            border-radius:18px;
            padding:40px;
            box-shadow:0 8px 25px rgba(0,0,0,0.08);
        }

        .form-header{

            text-align:center;
            margin-bottom:30px;
        }

        .form-header h2{

            color:#1f2937;
            font-size:32px;
            margin-bottom:8px;
        }

        .form-header p{

            color:#6b7280;
            font-size:15px;
        }

        .input-group{

            margin-bottom:22px;
        }

        .input-group label{

            display:block;
            margin-bottom:8px;
            color:#374151;
            font-weight:600;
            font-size:15px;
        }

        .input-wrapper{

            position:relative;
        }

        .input-wrapper i{

            position:absolute;
            top:50%;
            left:15px;
            transform:translateY(-50%);
            color:#6b7280;
        }

        .input-wrapper input,
        .input-wrapper select{

            width:100%;
            height:50px;
            border:1px solid #d1d5db;
            border-radius:12px;
            padding:0 15px 0 45px;
            font-size:15px;
            outline:none;
            transition:0.3s;
            background:#f9fafb;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus{

            border-color:#2563eb;
            background:white;
            box-shadow:0 0 0 4px rgba(37,99,235,0.1);
        }

        .submit-btn{

            width:100%;
            height:52px;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .submit-btn:hover{

            background:#1d4ed8;
            transform:translateY(-1px);
        }

        .footer-links{

            margin-top:25px;
            text-align:center;
        }

        .footer-links a{

            text-decoration:none;
            color:#2563eb;
            font-weight:600;
            margin:0 12px;
            transition:0.3s;
        }

        .footer-links a:hover{

            color:#1d4ed8;
        }

        @media(max-width:600px){

            .form-container{

                padding:30px 22px;
            }

            .form-header h2{

                font-size:26px;
            }
        }

    </style>

</head>

<body>

<div class="form-container">

    <div class="form-header">

        <h2>
            Add Student
        </h2>

        <p>
            Enter student details to create a new record
        </p>

    </div>

    <form th:action="@{/saveStudent}"
          method="post"
          th:object="${students}">

        <div class="input-group">

            <label>
                Full Name
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-user"></i>

                <input type="text"
                       th:field="*{name}"
                       placeholder="Enter full name"
                       required>

            </div>

        </div>

        <div class="input-group">

            <label>
                Address
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-location-dot"></i>

                <input type="text"
                       th:field="*{address}"
                       placeholder="Enter address"
                       required>

            </div>

        </div>

        <div class="input-group">

            <label>
                Age
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-calendar-days"></i>

                <input type="number"
                       th:field="*{age}"
                       placeholder="Enter age"
                       required>
            </div>
        </div>

        <div class="input-group">

            <label>
                Gender
            </label>
            <div class="input-wrapper">
                <i class="fa-solid fa-venus-mars"></i>

                <select th:field="*{gender}"
                        required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>
                </select>
            </div>
        </div>

        <button type="submit"
                class="submit-btn">
            <i class="fa-solid fa-floppy-disk"></i>
            Save Student
        </button>
    </form>

    <div class="footer-links">

        <a th:href="@{/students}">
            View Students
        </a>

        <a th:href="@{/}">
            Home
        </a>
    </div>
</div>
</body>
</html>
