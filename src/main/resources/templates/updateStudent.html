<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Student</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
            padding:20px;
        }

        .container{
            width:100%;
            max-width:500px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        input,
        select{
            width:100%;
            height:50px;
            margin-top:18px;
            border:1px solid #ccc;
            border-radius:10px;
            padding-left:15px;
            outline:none;
            font-size:15px;
        }

        button{
            width:100%;
            height:50px;
            margin-top:25px;
            border:none;
            border-radius:10px;
            background:#28a745;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Update Student</h2>

    <form th:action="@{/updateStudent}"
          method="post"
          th:object="${student}">

        <input type="hidden"
               th:field="*{id}">

        <input type="text"
               th:field="*{name}"
               placeholder="Enter Name"
               required>

        <input type="text"
               th:field="*{address}"
               placeholder="Enter Address"
               required>

        <input type="number"
               th:field="*{age}"
               placeholder="Enter Age"
               required>

        <select th:field="*{gender}"
                required>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

        </select>

        <button type="submit">

            Update Student

        </button>

    </form>

</div>

</body>

</html>
