<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .container{
            width:380px;
            background:white;
            padding:35px;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:13px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:10px;
            outline:none;
        }

        button{
            width:100%;
            padding:13px;
            margin-top:20px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        .error{
            color:red;
            text-align:center;
            margin-top:15px;
        }

        .logout{
            color:green;
            text-align:center;
            margin-top:15px;
        }

        p{
            margin-top:20px;
            text-align:center;
        }

        a{
            text-decoration:none;
            color:#007bff;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>User Login</h2>

    <form th:action="@{/login}"
          method="post">

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">

            Login

        </button>

    </form>

    <div th:if="${param.error}"
         class="error">

        Invalid Username or Password

    </div>

    <div th:if="${param.logout}"
         class="logout">

        Logout Successfully

    </div>

    <p>

        New User ?

        <a th:href="@{/register}">
            Register Here
        </a>

    </p>

</div>

</body>

</html>
